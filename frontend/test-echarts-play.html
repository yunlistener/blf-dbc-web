<!DOCTYPE html>
<html><head><meta charset="utf-8"><script src="/vendor/echarts.min.js"></script></head>
<body style="background:#16181d"><div id="c" style="width:900px;height:300px"></div>
<script>
const out = [];
const chart = echarts.init(document.getElementById('c'));
// 数据:922 点(部分,0~9.2s)
const part = [];
for (let i = 0; i < 922; i++) part.push([i * 0.01, Math.sin(i / 10) * 2]);
// xAxis 固定 0~46.1s
chart.setOption({
  xAxis: { type: 'value', min: 0, max: 46.1, axisLabel: { formatter: v => v.toFixed(2) + 's', color: '#8a93a3' } },
  yAxis: { type: 'value', splitLine: { lineStyle: { color: '#242830' } } },
  series: [{ type: 'line', data: part, showSymbol: false, animation: false, lineStyle: { width: 2, color: '#4da3ff' } }],
  animation: false,
});
out.push(`init: xAxis=[${chart.getOption().xAxis[0].min}, ${chart.getOption().xAxis[0].max}]`);
// 读取 xAxis 实际范围
const model = chart.getModel().getComponent('xAxis', 0);
out.push(`xAxis ext: ${JSON.stringify(model.axis.scale.getExtent())}`);
// 播放增长:数据 1500 点
chart.setOption({ series: [{ data: part.concat(Array.from({length:578},(_,i)=>[ (i+922)*0.01, Math.sin((i+922)/10)*2 ])) }] });
out.push(`grow1500: xAxis=[${chart.getOption().xAxis[0].min}, ${chart.getOption().xAxis[0].max}]`);
// 像素验证
setTimeout(() => {
  const cv = document.querySelector('canvas');
  let px = 0;
  if (cv && cv.width > 0) {
    const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    for (let i = 0; i < d.length; i += 4) if (d[i] + d[i+1] + d[i+2] > 120) px++;
  }
  out.push(`px=${px}`);
  document.title = "E " + out.join(" | ");
}, 800);
</script></body></html>
