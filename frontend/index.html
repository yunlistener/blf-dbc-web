<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAN 分析仪 — BLF/DBC 网页解析平台</title>
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div id="topbar">
    <div class="logo">CAN 分析仪</div>
    <div class="files">
      <span id="file-blf" class="file-chip">BLF: —</span>
      <span id="file-dbc" class="file-chip">DBC: —</span>
    </div>
    <div class="spacer"></div>
    <button id="btn-reset" class="btn" title="重置时间轴">重置缩放</button>
  </div>

  <div id="body">
    <!-- 左侧:报文/信号树(类似 CANoe 的 Database 面板) -->
    <aside id="sidebar">
      <div class="panel-title">报文 / 信号</div>
      <div id="msg-tree" class="tree">
        <div class="hint" id="tree-hint">加载中…</div>
      </div>
    </aside>

    <!-- 主区:Graphics 曲线窗口 -->
    <main id="main">
      <div id="chart"></div>
      <div id="cursor-panel" class="readout">
        <span class="ro-item"><b>时间</b> <span id="ro-time">—</span></span>
        <span class="ro-item"><b>信号</b> <span id="ro-sig">—</span></span>
        <span class="ro-item"><b>数值</b> <span id="ro-val">—</span></span>
        <span class="ro-item"><b>单位</b> <span id="ro-unit">—</span></span>
      </div>
    </main>
  </div>

  <!-- 底部状态栏 -->
  <div id="statusbar">
    <span id="st-frames">帧数 —</span>
    <span id="st-duration">时长 —</span>
    <span id="st-ids">报文数 —</span>
    <span class="spacer"></span>
    <span id="st-tip">点击左侧信号查看曲线 · 拖拽框选缩放 · 滚轮缩放</span>
  </div>

<script src="vendor/uPlot.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
