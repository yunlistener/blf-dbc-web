<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAN 分析仪 — BLF/DBC 网页解析平台</title>
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div id="topbar">
    <div class="logo">CAN 分析仪 <span id="app-version" class="app-version" title="前端版本号(强刷后应变化)"></span></div>
    <div class="files">
      <span id="file-blf" class="file-chip">BLF: —</span>
      <span id="file-dbc" class="file-chip">DBC: —</span>
    </div>
    <div class="spacer"></div>
    <button id="btn-upload" class="btn" onclick="openUpload()" title="上传 BLF / DBC 文件">上传文件</button>
    <button id="btn-export" class="btn" title="导出当前报文全部信号为 CSV">导出 CSV</button>
    <button id="btn-reset" class="btn" title="重置时间轴">重置缩放</button>
  </div>

  <div id="body">
    <!-- 左侧:报文/信号树 -->
    <aside id="sidebar">
      <div class="panel-title">
        <span>报文 / 信号</span>
        <button id="tree-sort" class="btn btn-mini" onclick="toggleTreeSort()" title="切换排序方式">排序: ID</button>
      </div>
      <input id="tree-search" class="tree-search" placeholder="🔍 搜索 ID / 名称 / ECU / 信号…" oninput="filterTree(this.value)">
      <div id="msg-tree" class="tree">
        <div class="hint" id="tree-hint">加载中…</div>
      </div>
    </aside>
    <!-- 信号树右侧把手:点击收起/展开信号树 -->
    <div class="drawer-handle" id="sidebar-handle" onclick="toggleSidebar()" title="报文/信号树">
      <span class="handle-icon">▤</span><span class="handle-text">信号</span>
    </div>

    <!-- 主区:曲线 + 底部面板 -->
    <main id="main">
      <!-- 播放控制栏(CANoe 式:配置完信号 → 点播放 → 曲线动态显示) -->
      <div id="playbar" class="playbar" style="display:none">
        <button id="btn-play" class="pb-btn" onclick="togglePlay()" title="播放/暂停">▶</button>
        <button id="btn-stop" class="pb-btn" onclick="stopPlayback()" title="停止(回到起点)">⏹</button>
        <input type="range" id="play-progress" min="0" max="1000" value="0"
               oninput="seekPlayback(this.value)" title="拖动定位">
        <span id="play-time" class="pb-time">0.0s</span>
        <span class="pb-dim">/</span>
        <span id="play-dur" class="pb-time">0.0s</span>
        <select id="play-rate" class="pb-rate" onchange="setPlayRate(this.value)" title="回放速率">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="5">5x</option>
        </select>
      </div>
      <div id="chart">
        <div id="sig-sidebar"></div>   <!-- 已选信号列 -->
        <div id="sig-resizer" title="拖动调整宽度"></div>
        <div id="plot-wrap"></div>     <!-- uPlot 挂载点 -->
      </div>

      <!-- 示波器高度三档把手:全部页面 / 2/3 / 全部收缩 -->
      <div id="chart-resizer" class="chart-resizer" onclick="cycleChartMode()" title="示波器高度:全部页面 / 2/3 页面 / 全部收缩">
        <span id="chart-mode-ind">▁▔ 2/3</span>
      </div>

      <!-- 底部标签页 -->
      <div id="tabs">
        <div class="tab active" data-tab="trace" onclick="switchTab('trace')">Trace 报文流</div>
        <div class="tab" data-tab="stats" onclick="switchTab('stats')">ID 统计</div>
        <div class="tab" data-tab="sigstats" onclick="switchTab('sigstats')">信号统计</div>
      </div>

      <!-- Trace 面板 -->
      <div id="panel-trace" class="panel">
        <div class="trace-toolbar">
          <select id="trace-msg" onchange="onTraceMsgChange()"></select>
          <select id="trace-sig" onchange=""><option value="">— 信号 —</option></select>
          <input id="trace-sig-val" class="trace-input" placeholder="值 / 状态名" onkeydown="if(event.key==='Enter')doTraceSearch()">
          <button id="trace-search" class="btn" onclick="doTraceSearch()">搜索</button>
          <button id="trace-clear" class="btn" onclick="clearTraceSearch()" style="display:none">清除</button>
          <button id="trace-range" class="btn" onclick="applyTraceRange()" title="按示波器当前缩放区间过滤">区间过滤</button>
          <button id="trace-range-clear" class="btn" onclick="clearTraceRange()" style="display:none">清除区间</button>
          <button id="trace-prev" class="btn" onclick="tracePage(-1)">← 上一页</button>
          <button id="trace-next" class="btn" onclick="tracePage(1)">下一页 →</button>
          <span id="trace-info" class="trace-info"></span>
        </div>
        <div class="trace-wrap">
          <table class="trace" id="trace-table">
            <thead><tr>
              <th>时间(s)</th><th>ID</th><th>报文</th><th>DLC</th><th>CH</th><th>数据(hex)</th>
            </tr></thead>
            <tbody id="trace-body"><tr><td colspan="6" class="hint">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ID 统计面板 -->
      <div id="panel-stats" class="panel" style="display:none">
        <div id="busload-box" class="busload-box"></div>
        <div id="stats-box" class="stats-box"><div class="hint">加载中…</div></div>
      </div>

      <!-- 信号统计面板 -->
      <div id="panel-sigstats" class="panel" style="display:none">
        <div id="sigstats-box" class="stats-box"><div class="hint">请先选择信号(点击左侧信号树)</div></div>
      </div>
    </main>

    <!-- 右侧把手(常驻):配置抽屉,点击展开/收回 -->
    <div class="drawer-handle" id="cfg-handle" onclick="toggleConfigDrawer()" title="工程配置">
      <span class="handle-icon">⚙</span><span class="handle-text">配置</span>
    </div>
    <div id="config-drawer" class="drawer">
      <div class="drawer-body">
        <div class="drawer-title">工程配置</div>
        <div class="config-row">
          <label>总线类型</label>
          <select id="cfg-bus-type">
            <option value="canfd">CAN FD</option>
            <option value="can">CAN 经典</option>
          </select>
        </div>
        <div class="config-row" id="row-baud-arb">
          <label>仲裁段波特率</label>
          <select id="cfg-baud-arb">
            <option value="125000">125 kbit/s</option>
            <option value="250000">250 kbit/s</option>
            <option value="500000" selected>500 kbit/s</option>
            <option value="1000000">1 Mbit/s</option>
          </select>
        </div>
        <div class="config-row" id="row-baud-data">
          <label>数据段波特率</label>
          <select id="cfg-baud-data">
            <option value="1000000">1 Mbit/s</option>
            <option value="2000000" selected>2 Mbit/s</option>
            <option value="5000000">5 Mbit/s</option>
          </select>
        </div>
        <div class="config-row">
          <label>Bus Log 文件</label>
          <select id="cfg-blf"><option value="">— 请选择 —</option></select>
        </div>
        <div id="blf-info" class="blf-info"></div>
        <div class="config-row" style="align-items:flex-start">
          <label style="padding-top:6px">通道 DBC</label>
          <div id="cfg-channels" class="chan-list"><div class="hint">加载 BLF 后显示通道…</div></div>
        </div>
        <div class="config-row">
          <label>显示选项</label>
          <label class="chk-row" style="display:flex;align-items:center;gap:6px;color:#c9ced6;font-weight:400">
            <input type="checkbox" id="cfg-jitter-mark" onchange="onJitterMarkToggle()"> 标记抖动峰值
          </label>
        </div>
        <div class="config-hint" id="config-tip"></div>
        <div class="drawer-actions">
          <button class="btn primary" onclick="saveConfig()">保存并应用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div id="statusbar">
    <span id="st-frames">帧数 —</span>
    <span id="st-duration">时长 —</span>
    <span id="st-ids">报文数 —</span>
    <span class="spacer"></span>
    <span id="st-tip">点击左侧信号查看曲线(可多选叠加)· 拖拽框选缩放 · 滚轮缩放</span>
  </div>

  <!-- 上传模态 -->
  <div id="upload-modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title">上传文件<span class="modal-close" onclick="closeUpload()">×</span></div>
      <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
        拖拽 .blf / .dbc 文件到此处<br><small>或点击选择文件(可多选)</small>
      </div>
      <input type="file" id="file-input" multiple accept=".blf,.dbc" style="display:none">
      <div id="upload-list" class="upload-list"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeUpload()">取消</button>
        <button class="btn primary" id="btn-upload-go" onclick="startUpload()" disabled>上传</button>
      </div>
    </div>
  </div>

  <!-- 配置抽屉(嵌入主页面,点击右边缘展开/收起) -->

  <!-- 光标 tooltip(示波器/已选信号 hover 时显示读数) -->
  <div id="cursor-tip" class="cursor-tip" style="display:none"></div>

  <!-- 添加信号模态(示波器内 + 信号 按钮触发) -->
  <div id="add-signal-modal" class="modal" style="display:none">
    <div class="modal-box add-modal-box">
      <div class="modal-title">向示波器 <b id="add-target"></b> 添加信号
        <span class="modal-close" onclick="closeAddSignal()">×</span></div>
      <input id="add-search" class="tree-search" placeholder="🔍 搜索 ID / 名称 / ECU / 信号…" oninput="renderAddSignalList(this.value)">
      <div id="add-signal-list" class="add-signal-list"></div>
    </div>
  </div>

<script src="vendor/uPlot.min.js"></script>
<script src="js/app.js?v=91"></script>
</body>
</html>
